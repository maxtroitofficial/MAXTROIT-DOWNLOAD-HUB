name: Deploy MY DOWNLOAD HUB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/957047554501/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-firebase-deploy@maxtroit-download-hub.iam.gserviceaccount.com
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy original Hosting site
        run: firebase deploy --only hosting --project maxtroit-download-hub --non-interactive
