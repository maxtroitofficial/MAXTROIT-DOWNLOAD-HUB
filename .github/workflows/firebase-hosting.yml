name: Deploy MAXTROIT Download Hub

on:
  push:
    branches:
      - main
      - fix/remove-security-login-live
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Admin Panel change and preserve normal login
        run: |
          node --check admin.js
          node tests/invariants.mjs
          node tests/builder-core.test.mjs
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('admin.html', 'utf8');
          const js = fs.readFileSync('admin.js', 'utf8');
          const css = fs.readFileSync('admin.css', 'utf8');
          if (/security-admin-tab|id="security-admin"|Security &amp; Login/i.test(html)) throw new Error('Security & Login UI remains in admin.html');
          if (/security-workspace|admin-password-form|securityTab|securityPanel/i.test(js + css)) throw new Error('Security workspace code remains');
          if (!html.includes('id="login-form"') || !js.includes('signInWithEmailAndPassword')) throw new Error('Normal email/password admin login is missing');
          console.log('Security UI removed; normal admin login preserved.');
          NODE

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/957047554501/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-firebase-deploy@maxtroit-download-hub.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Ensure d-hub Hosting site exists
        shell: bash
        run: |
          set -euo pipefail
          if ! firebase hosting:sites:list --project maxtroit-download-hub --json | grep -q 'sites/d-hub'; then
            firebase hosting:sites:create d-hub --project maxtroit-download-hub --non-interactive
          fi

      - name: Deploy website and Firestore rules to d-hub.web.app
        run: firebase deploy --only hosting,firestore:rules --project maxtroit-download-hub --non-interactive
