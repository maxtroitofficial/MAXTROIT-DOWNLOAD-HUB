name: Validate Website Visual Editor
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/full-website-editor]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          for file in admin.js app.js download.js firebase.js firebase-config.js builder-core.js builder-renderer.js builder-app.js website-editor-ui.js; do
            node --check "$file"
          done
      - name: Visual editor regression invariants
        run: |\n          node tests/invariants.mjs\n          node tests/builder-core.test.mjs
