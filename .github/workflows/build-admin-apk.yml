name: Build MAXTROIT Admin Universal APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/remove-security-login-live
    paths:
      - "android/**"
      - ".github/workflows/build-admin-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build one universal APK (no ABI splits)
        run: gradle --no-daemon -p android assembleDebug
      - name: Verify and name universal APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/MAXTROIT-Admin-Universal.apk
          unzip -t dist/MAXTROIT-Admin-Universal.apk
          SIZE=$(stat -c%s dist/MAXTROIT-Admin-Universal.apk)
          echo "APK size: $SIZE bytes"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$AAPT" dump badging dist/MAXTROIT-Admin-Universal.apk | tee dist/apk-metadata.txt
          grep -q "package: name='com.maxtroit.admin'" dist/apk-metadata.txt
          grep -q "application-label:'MAXTROIT Admin'" dist/apk-metadata.txt
          sha256sum dist/MAXTROIT-Admin-Universal.apk | tee dist/SHA256SUMS.txt
      - name: Upload verified universal APK
        uses: actions/upload-artifact@v4
        with:
          name: MAXTROIT-Admin-Universal-APK
          path: |
            dist/MAXTROIT-Admin-Universal.apk
            dist/apk-metadata.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
