name: Build universal Admin APK

on:
  pull_request:
    paths:
      - "android-admin/**"
      - ".github/workflows/build-admin-apk.yml"
  push:
    branches:
      - fork-setup-guide
    paths:
      - "android-admin/**"
      - ".github/workflows/build-admin-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: android-admin
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: download-hub-admin-debug-apk
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
