name: Deploy MAXTROIT Download Hub to Firebase Hosting (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy_live:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript
        run: |
          for file in admin.js app.js download.js firebase.js firebase-config.js unlock-admin.js; do
            node --check "$file"
          done
          node tests/invariants.mjs

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/957047554501/locations/global/workloadIdentityPools/github-pool/providers/github
          service_account: github-firebase-deploy@maxtroit-download-hub.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Hosting and Firestore rules
        run: firebase deploy --only hosting,firestore:rules --project maxtroit-download-hub --non-interactive
