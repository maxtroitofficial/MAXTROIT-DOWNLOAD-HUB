plugins { id "com.android.application" }

android {
    namespace "com.maxtroit.downloadhubadmin"
    compileSdk 35

    defaultConfig {
        applicationId "com.maxtroit.downloadhubadmin"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.core:core:1.15.0"
}

// Package the real website Admin UI and its supporting JS/CSS/assets in the APK.
// Exclude build tooling and the Android project itself; all site files remain in-repo.
tasks.register("syncAdminWebAssets", Sync) {
    from(rootProject.projectDir.parentFile) {
        exclude ".git/**", ".github/**", "android-admin/**", "node_modules/**", ".firebase/**"
    }
    into(layout.projectDirectory.dir("src/main/assets"))
}
tasks.named("preBuild").configure {
    dependsOn("syncAdminWebAssets")
}
